<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Edgar Pichardo, systems engineer in Guadalajara">
  <style>
    .ent { animation: subir .8s cubic-bezier(.2,.7,.3,1) both; }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .5s; }
    .d3 { animation-delay: 1.1s; }
    .regla { transform-box: fill-box; transform-origin: left center; animation: trazar .9s cubic-bezier(.65,0,.35,1) .35s both; }
    .punto { transform-box: fill-box; transform-origin: center; animation: latir 2.8s ease-in-out 1.6s infinite; }
    @keyframes subir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes trazar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes latir { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .ent, .regla, .punto { animation: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="258" rx="12" fill="#0d1117" stroke="#262c36" stroke-width="2"/>

  <text class="ent d1" x="72" y="134" font-family="Charter, 'Iowan Old Style', 'Palatino Linotype', Georgia, Cambria, serif" font-size="60" fill="#e6edf3" letter-spacing="-0.5">Edgar Pichardo</text>
  <rect class="regla" x="74" y="158" width="56" height="2" fill="#e6edf3"/>
  <text class="ent d2" x="72" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#8b949e">systems engineer, guadalajara</text>

  <g class="ent d3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
    <circle class="punto" cx="726" cy="192" r="4" fill="#3fb950"/>
    <text x="1128" y="198" text-anchor="end" fill="#6e7681">now building: a school management system</text>
  </g>
</svg>
